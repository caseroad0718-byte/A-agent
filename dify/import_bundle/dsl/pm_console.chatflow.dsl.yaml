          "data": {
            "type": "code",
            "title": "Strip Reasoning Tags",
            "desc": "",
            "selected": false,
            "variables": [
              {
                "variable": "raw_text",
                "value_selector": [
                  "pm_console_llm",
                  "text"
                ]
              }
            ],
            "code_language": "python3",
            "code": "import re\n\ndef main(raw_text: str) -> dict:\n    text = raw_text or \"\"\n    text = re.sub(r\"<think>.*?</think>\", \"\", text, flags=re.I | re.S)\n    text = re.sub(r\"</?think>\", \"\", text, flags=re.I)\n    return {\"answer\": text.strip()}\n",
            "outputs": {
              "answer": {
                "type": "string"
              }
            }
          }
        },
